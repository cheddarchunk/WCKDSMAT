[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wckdsmat"
dynamic = ["version"]   # read from src/wckdsmat/__init__.py
description = "Webcam-based facial kinematics for speech and oral-motor research: landmark extraction, calibration to mm, head normalization, articulator kinematics, and validation against motion capture."
readme = "README.md"
requires-python = ">=3.11"   # tomllib
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/cheddarchunk/WCKDSMAT"

[project.scripts]
wckdsmat = "wckdsmat.cli:main"

[project.optional-dependencies]
video = ["mediapipe==0.10.21"]   # extract; the validated MediaPipe version (brings OpenCV, needs numpy<2)
viewer = ["dash>=2.17,<5", "plotly>=5.20"]   # Speech Movement Data Viewer (audio via ffmpeg on PATH)
dev = ["pytest", "ruff"]
all = ["wckdsmat[video,viewer]"]

[tool.hatch.version]
path = "src/wckdsmat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wckdsmat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"   # dash ships a pytest plugin we do not use

[tool.ruff]
line-length = 100
