[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wckdsmat"
version = "0.1.0.dev0"
description = "Webcam-based facial kinematics for speech and oral-motor research: landmark extraction, calibration to mm, head normalization, articulator kinematics, and validation against motion capture."
readme = "README.md"
requires-python = ">=3.11"   # tomllib
# license = TODO: choose (e.g. MIT, BSD-3-Clause, GPL-3.0) before release
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.scripts]
wckdsmat = "wckdsmat.cli:main"

[project.optional-dependencies]
video = ["mediapipe==0.10.21"]   # extract; the validated MediaPipe version (brings OpenCV, needs numpy<2)
validate = ["matplotlib>=3.8", "seaborn>=0.13"]
viewer = ["dash", "flask", "plotly", "librosa", "matplotlib>=3.8"]
dev = ["pytest", "ruff"]
all = ["wckdsmat[video,validate,viewer]"]

[tool.hatch.build.targets.wheel]
packages = ["src/wckdsmat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
